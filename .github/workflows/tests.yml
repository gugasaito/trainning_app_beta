name: Testes do Tracker Beta
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar com dados fictícios
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=resultados.xml tests/*.test.mjs
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes-beta
          path: resultados.xml
